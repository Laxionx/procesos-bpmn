name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: XSD oficiales de BPMN 2.0 (OMG)
        run: |
          mkdir -p xsd
          for f in BPMN20.xsd Semantic.xsd BPMNDI.xsd DC.xsd DI.xsd; do
            curl -sfL -o "xsd/$f" "https://www.omg.org/spec/BPMN/20100501/$f"
          done
      - name: Ruff
        run: ruff check . && ruff format --check .
      - name: Pytest con cobertura
        run: pytest --cov=procesos_bpmn --cov-report=term-missing --cov-fail-under=90
      - name: Validar los .bpmn publicados
        run: python -m procesos_bpmn validar salidas --xsd xsd
