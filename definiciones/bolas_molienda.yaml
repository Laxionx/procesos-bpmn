id: bolas_molienda
nombre: Fabricación de bolas de molienda de alto cromo en coquilla
documentacion: >
  Procedimiento genérico e ilustrativo de la fabricación de bolas de molienda de fundición blanca
  de alto cromo coladas en coquilla. La secuencia de pasos se revisó con la experiencia práctica
  del autor en fundición. No reproduce el procedimiento de ninguna empresa ni incluye parámetros:
  la química, las temperaturas, las durezas y el ensayo de caída los fija cada fabricante y cliente.
  Las coquillas se preparan mientras se funde el metal; el control final del lote lo hace el área
  de calidad.
carriles:
  - Fusión
  - Moldeo en coquilla
  - Tratamiento térmico
  - Control de calidad
  - Despacho
